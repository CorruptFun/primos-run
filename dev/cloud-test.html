<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-test — pure logic for saves &amp; boards</title>
<style>
  body { margin: 0; padding: 24px; background: #1a1024; color: #fdf6e6;
         font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { font-size: 16px; letter-spacing: 0.14em; color: #ffc93c; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: rgba(253,246,230,0.5); font-size: 12px; }
  h2 { font-size: 12px; letter-spacing: 0.16em; color: rgba(253,246,230,0.62);
       margin: 20px 0 6px; text-transform: uppercase; }
  .ok { color: #9ee34f; }
  .bad { color: #ff6b6b; }
  .row { padding: 2px 0; }
  .row small { color: rgba(253,246,230,0.38); }
  #total { margin-top: 24px; padding: 12px 14px; border-radius: 10px; font-weight: 700; }
  #total.pass { background: rgba(158,227,79,0.14); border-left: 3px solid #9ee34f; }
  #total.fail { background: rgba(255,107,107,0.14); border-left: 3px solid #ff6b6b; }
</style>

<body>
<h1>CLOUD-TEST</h1>
<p class="sub">
  The pure half of the cloud layer — no network, no auth. Open this file over the dev server
  (<code>dev/cloud-test.html</code>) after touching raceday.js, merge.js or store.js.
</p>
<div id="out"></div>
<div id="total"></div>

<script type="module">
// Dynamic imports with a cache-buster: python's http.server answers with
// Last-Modified, and the browser happily reuses a stale ES module across
// reloads. On a test page that is worse than anywhere else — it shows you a
// green wall of assertions against the build you just replaced.
const V = `?t=${Date.now()}`;
const { dayKey, previousDayKey, weekOfDay, weekKey, bestForDay, recordDay, pruneDays,
        dayWasContinued, formatWeekStanding } = await import(`../js/raceday.js${V}`);
const { mergeSaves } = await import(`../js/merge.js${V}`);
const { anonName, sanitizeName } = await import(`../js/leaderboard.js${V}`);
const { coerce } = await import(`../js/store.js${V}`);
const { inviteLink } = await import(`../js/referrals.js${V}`);
const { EVENTS } = await import(`../js/analytics.js${V}`);
const { KINDS, MAX_CONTACT, MAX_MESSAGE, MIN_MESSAGE, normalizeKind, sanitizeContact,
        sanitizeMessage, validateFeedback } = await import(`../js/feedback.js${V}`);
const { RACHA_TABLE, coerceRacha, settleRacha, rachaAtRisk, rachaShown } =
  await import(`../js/racha.js${V}`);
const { JALE_REWARD, JALE_SWEEP, JALE_POOL, jalesForDay, coerceJales, applyJalesRun,
        jalesStatus } = await import(`../js/jales.js${V}`);
const { buildFunnel, coerceFeedback, coerceStats, fillDays, fillScoreBuckets, niceScale, rate,
        ratePct, retentionRate, FEEDBACK_STATUSES, SCORE_BUCKET_LABELS } =
        await import(`../js/stats/model.js${V}`);

const out = document.getElementById('out');
let pass = 0, fail = 0;

function group(title) {
  const h = document.createElement('h2');
  h.textContent = title;
  out.append(h);
}
function eq(got, want, label) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 'row ' + (ok ? 'ok' : 'bad');
  d.innerHTML = (ok ? '✓ ' : '✗ ') + label +
    (ok ? '' : ` <small>got ${JSON.stringify(got)} · want ${JSON.stringify(want)}</small>`);
  out.append(d);
}

// ─────────────────────────────────────────────────────────────────────────────
// These cases are DUPLICATED, deliberately, in the self-check at the bottom of
// supabase/migrations/0001_primos_cloud.sql. The server validates every
// submission's day key, so if the two implementations drift the database starts
// rejecting honest scores and the board silently goes empty. Change one side and
// you must change the other.
// ─────────────────────────────────────────────────────────────────────────────
group('day keys — must match primos_day_key()');
eq(dayKey(new Date('2026-07-29T00:00:00Z')), '2026-07-29', 'the moment the board opens');
eq(dayKey(new Date('2026-07-29T23:59:59Z')), '2026-07-29', 'last second of the same board');
eq(dayKey(new Date('2026-07-30T00:00:00Z')), '2026-07-30', 'the rollover, exactly');
eq(dayKey(new Date('2026-01-01T12:00:00Z')), '2026-01-01', 'year seam');
eq(dayKey(new Date('2026-03-01T00:00:00Z')), '2026-03-01', 'month seam, non-leap February');
eq(previousDayKey(new Date('2026-01-01T00:30:00Z')), '2025-12-31', 'yesterday across a year seam');

group('ISO weeks — must match primos_week_of_day()');
eq(weekOfDay('2026-07-27'), '2026-W31', 'Monday: the season opens');
eq(weekOfDay('2026-08-02'), '2026-W31', 'Sunday: still the same season');
eq(weekOfDay('2026-08-03'), '2026-W32', 'next Monday: a new one');
eq(weekOfDay('2025-12-29'), '2026-W01', 'ISO year seam: W01 starts in December');
eq(weekOfDay('2026-01-04'), '2026-W01', 'W01 tail');
eq(weekOfDay('2026-01-05'), '2026-W02', 'W02 head');
eq(weekKey(new Date('2026-08-02T23:00:00Z')), '2026-W31', 'weekKey composes dayKey');

group('anonymous name — must match primos_anon_display_name()');
eq(anonName('7f3a91b2-0000-4000-8000-000000000000'), 'Player 7F3A', 'the shared case the migration asserts');
eq(anonName(null), 'player', 'no user id degrades, never throws');

group('name sanitising — the privacy invariant');
eq(sanitizeName('jane.doe@gmail.com'), 'jane.doe', 'an email is cut at the @, never published whole');
eq(sanitizeName('  <script>  '), 'script', 'markup characters are stripped');
eq(sanitizeName(''), 'player', 'empty falls back');
eq(sanitizeName('Ñoño Güero'), 'Ñoño Güero', 'accented letters survive — ASCII-only would mangle names');
eq(sanitizeName('x'.repeat(40)).length, 24, 'capped at 24');

group('day records');
{
  const s = { days: {} };
  recordDay(s, 500, new Date('2026-07-29T10:00:00Z'));
  recordDay(s, 300, new Date('2026-07-29T11:00:00Z'));
  eq(bestForDay(s, '2026-07-29'), 500, 'keeps the day BEST, not the last run');
  recordDay(s, 900, new Date('2026-07-29T12:00:00Z'));
  eq(bestForDay(s, '2026-07-29'), 900, 'a better run raises it');
  eq(bestForDay({ days: { x: NaN } }, 'x'), 0, 'a corrupt entry degrades to 0, never NaN');
  eq(bestForDay({}, '2026-07-29'), 0, 'a save with no days map is fine');

  s.days['2026-01-01'] = 1;
  pruneDays(s, 60, new Date('2026-07-29T00:00:00Z'));
  eq(Object.keys(s.days).sort(), ['2026-07-29'], 'days beyond the window are dropped');
}

group('merge — the one function that can destroy progress');
{
  const local = { best: 900, bestBeers: 3, runs: 10, totalBeers: 40, character: 'chuy',
                  days: { '2026-07-29': 900 }, handle: 'local', handleSetAt: 100 };
  const cloud = { best: 500, bestBeers: 9, runs: 4, totalBeers: 80, character: 'flaca',
                  days: { '2026-07-28': 500 }, handle: 'cloud', handleSetAt: 200 };
  const m = mergeSaves(local, cloud);

  eq(m.best, 900, 'best is maxed');
  eq(m.bestBeers, 9, 'a record only the LOSING side holds still survives');
  eq(m.totalBeers, 80, 'lifetime counters are maxed, not taken from the winner');
  eq(m.runs, 10, 'runs maxed');
  eq(m.character, 'chuy', 'preferences come from the progress winner');
  eq(m.days, { '2026-07-29': 900, '2026-07-28': 500 },
     'both devices’ boards survive — picking a side would delete one');
  eq(m.handle, 'cloud', 'the newer NAME wins even though the other side had the better run');
  eq(mergeSaves(local, local).handle, 'local', 'a dead tie prefers local');
  eq(mergeSaves(local, cloud).best, mergeSaves(cloud, local).best, 'best is order-independent');

  const cleared = { best: 0, bestBeers: 0, runs: 0, totalBeers: 0, days: {}, handle: null, handleSetAt: 0 };
  eq(mergeSaves(cleared, cloud).handle, 'cloud', 'a cleared browser adopts the cloud’s name');
  eq(mergeSaves(cleared, cloud).best, 500, 'and its progress');
}

group('merge — money, where a mistake MINTS currency');
{
  // The shape a max would reward: the spend already happened on the side that
  // also holds the better run, and the other device has not heard about it.
  const rich  = { best: 100, walletSeeded: true, chelas: 500, days: {} };
  const spent = { best: 900, walletSeeded: true, chelas: 0,   days: {} };
  eq(mergeSaves(spent, rich).chelas, 0, 'chelas is NOT maxed — a max hands back what was already spent');
  eq(mergeSaves(rich, spent).chelas, 0, 'and that does not depend on argument order');

  // Both seeded → the balance rides the progress winner, like the rest of the
  // record. Always a number some device genuinely held; nothing is invented.
  const a300 = { best: 900, walletSeeded: true, chelas: 300, days: {} };
  const b50  = { best: 100, walletSeeded: true, chelas: 50,  days: {} };
  eq(mergeSaves(b50, a300).chelas, 300, 'two seeded wallets ride the progress winner');

  // The one-time latch. Without the union the seed re-runs against a totalBeers
  // that LATCHES has just maxed, and mints the whole lifetime total again.
  const seeded   = { best: 100, walletSeeded: true,  chelas: 200, days: {} };
  const unseeded = { best: 900, walletSeeded: false, totalBeers: 5000, days: {} };
  const mixed = mergeSaves(unseeded, seeded);
  eq(mixed.walletSeeded, true, 'walletSeeded UNIONS — true wins, so the seed can never run twice');
  eq(mixed.chelas, 200, 'and the seeded side’s balance carries, even though it LOST on progress');
  eq(mergeSaves(seeded, unseeded).walletSeeded, true, 'the union is order-independent');

  // Neither side has seeded yet: the latch stays down and the seed is still to
  // come, which is the truth — it has not happened on either device.
  const fresh1 = { best: 900, totalBeers: 400, days: {} };
  const fresh2 = { best: 100, totalBeers: 900, days: {} };
  const neither = mergeSaves(fresh1, fresh2);
  eq(neither.walletSeeded, false, 'neither seeded leaves the latch down');
  eq(neither.totalBeers, 900, 'lifetime total is still maxed — that one is a record');
  eq(neither.chelas, 0, 'and the wallet is zero until the one-time seed runs');

  eq(mergeSaves({ best: 1, walletSeeded: true, chelas: NaN, days: {} },
                { best: 0, walletSeeded: true, chelas: 5, days: {} }).chelas,
     0, 'a corrupt balance degrades to 0 — never NaN into a save');
}

group('merge — the shelf is BOUGHT GOODS');
{
  const winner = { best: 900, shelf: { vida: 1 }, days: {} };
  const loser  = { best: 100, shelf: { magnet: 2 }, days: {} };
  const m = mergeSaves(winner, loser);
  eq(m.shelf, { vida: 1, magnet: 2 },
     'the LOSING side’s purchase survives — riding the winner would bin something paid for');
  const flipped = mergeSaves(loser, winner);
  eq(Object.keys(flipped.shelf).sort(), ['magnet', 'vida'], 'union is order-independent');
  eq(flipped.shelf.magnet, 2, 'and so are the counts');

  eq(mergeSaves({ best: 900, shelf: { vida: 1 }, days: {} },
                { best: 100, shelf: { vida: 3 }, days: {} }).shelf,
     { vida: 3 }, 'per item it takes the MAX, so a stack is not silently cut down');

  eq(mergeSaves({ best: 1, shelf: { vida: NaN, gone: 0, bad: -2 }, days: {} },
                { best: 0, days: {} }).shelf,
     {}, 'junk counts are dropped rather than written back into the save');
  eq(mergeSaves({ best: 1, days: {} }, { best: 0, days: {} }).shelf, {},
     'no shelf on either side is an empty shelf, not undefined');
}

group('continues — eligible, but marked');
{
  const at = new Date('2026-07-29T10:00:00Z');
  const s = { days: {}, contDays: {} };

  recordDay(s, 400, at, true);
  eq(dayWasContinued(s, '2026-07-29'), true, 'a bought run marks the day it takes');

  recordDay(s, 200, at, false);
  eq(bestForDay(s, '2026-07-29'), 400, 'a weaker clean run does not take the day');
  eq(dayWasContinued(s, '2026-07-29'), true,
     'and cannot scrub the mark off the score that still stands');

  recordDay(s, 900, at, false);
  eq(bestForDay(s, '2026-07-29'), 900, 'a better clean run does take it');
  eq(dayWasContinued(s, '2026-07-29'), false, 'and the mark goes with the old score');

  eq(dayWasContinued({}, '2026-07-29'), false, 'a save with no map is unmarked, never undefined');

  // Pruning has to take both maps or the marks outlive their scores.
  const old = { days: { '2026-01-01': 5, '2026-07-29': 9 },
                contDays: { '2026-01-01': true, '2026-07-29': true } };
  pruneDays(old, 60, new Date('2026-07-29T00:00:00Z'));
  eq(Object.keys(old.contDays), ['2026-07-29'], 'marks are pruned with the days they annotate');
}

group('continues — the mark survives a merge intact');
{
  const boughtHigh = { best: 1, days: { d: 900 }, contDays: { d: true } };
  const cleanLow   = { best: 1, days: { d: 400 }, contDays: {} };
  eq(mergeSaves(cleanLow, boughtHigh).days.d, 900, 'the better day wins, as always');
  eq(mergeSaves(cleanLow, boughtHigh).contDays, { d: true },
     'and its mark comes with it — the surviving score really was bought');

  const cleanHigh  = { best: 1, days: { d: 900 }, contDays: {} };
  const boughtLow  = { best: 1, days: { d: 400 }, contDays: { d: true } };
  eq(mergeSaves(cleanHigh, boughtLow).contDays, {},
     'a losing bought day does NOT mark a clean winner — a union would smear it');
  eq(mergeSaves(boughtLow, cleanHigh).contDays, {}, 'and that holds in either order');

  eq(mergeSaves({ best: 1, days: { a: 1 }, contDays: { a: true } },
                { best: 1, days: { b: 2 }, contDays: {} }).contDays,
     { a: true }, 'days only one device played keep their own marks');
}

group('training — a latch, and a max would break it');
{
  // The ordinary case, not an unlucky one: the tutorial finishes BEFORE the
  // first run, so a freshly-taught save ties an untouched one on every metric
  // progressWinner looks at — and the tie prefers local.
  const taught = { best: 0, runs: 0, days: {}, trainedAt: 1754000000000 };
  const fresh  = { best: 0, runs: 0, days: {}, trainedAt: 0 };
  eq(mergeSaves(fresh, taught).trainedAt, 1754000000000,
     'a second device adopts the training instead of replaying it');
  eq(mergeSaves(taught, fresh).trainedAt, 1754000000000, 'and that does not depend on argument order');

  // LEGACY is -1: a marker for a save that predates the tutorial, not a
  // timestamp. Math.max(-1, 0) is 0 — the grandfathered player sat back down.
  const legacy = { best: 900, runs: 40, days: {}, trainedAt: -1 };
  eq(mergeSaves(legacy, fresh).trainedAt, -1, 'the LEGACY sentinel survives a max that would flatten it to 0');
  eq(mergeSaves(fresh, legacy).trainedAt, -1, 'in either order');
  eq(mergeSaves(legacy, taught).trainedAt, 1754000000000, 'a real session beats the sentinel');

  // The property itself: nothing here moves a player back to untrained.
  const untaughtRecord = { best: 9000, runs: 99, days: {}, trainedAt: 0 };
  eq(mergeSaves(untaughtRecord, taught).trainedAt, 1754000000000,
     'training survives even when the side holding it LOSES on progress');

  eq(mergeSaves(fresh, fresh).trainedAt, 0, 'neither side taught stays untaught — the tutorial is still owed');
  eq(mergeSaves({ best: 1, days: {} }, { best: 0, days: {} }).trainedAt, 0,
     'absent on both sides is untrained, never undefined');
  eq(mergeSaves({ best: 1, days: {}, trainedAt: 200 },
                { best: 0, days: {}, trainedAt: 100 }).trainedAt,
     200, 'two real sessions keep the newer stamp');
  eq(mergeSaves({ best: 1, days: {}, trainedAt: NaN },
                { best: 0, days: {}, trainedAt: 500 }).trainedAt,
     500, 'a corrupt stamp degrades rather than poisoning the latch');
}

group('invites — the link that actually circulates');
{
  // Hardcoded to the canonical origin on purpose. A link built from location
  // would spread whichever origin the sender happened to be on, and localStorage
  // is per-origin — so the friend would land on a different save entirely.
  eq(inviteLink('ABC123'), 'https://corrupt.solutions/games/primos/?ref=ABC123',
     'the canonical origin, not wherever the sender happens to be running');
  // The trailing slash stays: the proxy 308s the slash-less form, so dropping it
  // costs a redirect on every invite ever sent.
  eq(inviteLink('ZZ0099').includes('/primos/?ref='), true, 'the trailing slash survives the query');
}

group('invites — the welcome latch, where a mistake MINTS beers');
{
  // Same shape as the training latch, and the ordinary case for the same reason:
  // collecting a welcome happens to a nearly-new account, so both sides sit on
  // the same tiny numbers, every metric ties, and the tie prefers local.
  const paid  = { best: 0, runs: 0, days: {}, referralWelcomeClaimed: true };
  const fresh = { best: 0, runs: 0, days: {}, referralWelcomeClaimed: false };
  eq(mergeSaves(fresh, paid).referralWelcomeClaimed, true,
     'a cleared device cannot re-open a welcome that was already paid');
  eq(mergeSaves(paid, fresh).referralWelcomeClaimed, true, 'and that does not depend on argument order');

  const richUnpaid = { best: 9000, runs: 99, days: {}, referralWelcomeClaimed: false };
  eq(mergeSaves(richUnpaid, paid).referralWelcomeClaimed, true,
     'the latch survives even when the side holding it LOSES on progress');
  eq(mergeSaves(fresh, fresh).referralWelcomeClaimed, false,
     'neither side paid leaves the welcome still owed');
  eq(mergeSaves({ best: 1, days: {} }, { best: 0, days: {} }).referralWelcomeClaimed, false,
     'absent on both sides is unpaid, never undefined');
}

group('invites — referredBy is a set-once label');
{
  const invited = { best: 0, days: {}, referredBy: 'ABC123' };
  const organic = { best: 0, days: {}, referredBy: null };
  eq(mergeSaves(organic, invited).referredBy, 'ABC123', 'a cleared device recovers who invited it');
  eq(mergeSaves(invited, organic).referredBy, 'ABC123', 'in either order');
  eq(mergeSaves(invited, { best: 0, days: {}, referredBy: 'ZZ9999' }).referredBy, 'ABC123',
     'a disagreement keeps local, like everywhere else in the merge');
  eq(mergeSaves(organic, organic).referredBy, null, 'nobody invited them and that stays true');
}

group('invites — a referral code has to survive a hand-edited save');
{
  // These ride into a cloud lookup, so junk must degrade to "no inviter" rather
  // than go on the wire. captureRefFromUrl and setReferredBy both upper-case
  // before writing, so lower case on disk means someone edited it.
  eq(coerce({ referredBy: 'ABC123' }).referredBy, 'ABC123', 'a real code passes through');
  eq(coerce({ referredBy: 'abc123' }).referredBy, null, 'lower case never reached disk honestly');
  eq(coerce({ referredBy: 'TOOLONG7' }).referredBy, null, 'wrong length is refused');
  eq(coerce({ referredBy: 'AB-123' }).referredBy, null, 'punctuation is refused');
  eq(coerce({ referredBy: 12345 }).referredBy, null, 'a number is not a code');
  eq(coerce({}).referredBy, null, 'absent is null, never undefined');
  eq(coerce({ referralWelcomeClaimed: 'yes' }).referralWelcomeClaimed, false,
     'only a real true counts as paid — a truthy string must not spend the latch');
  eq(coerce({ referralWelcomeClaimed: true }).referralWelcomeClaimed, true, 'and a real true does');
}

group('la racha — the streak pays for running, once a day');
{
  eq(settleRacha(null, '2026-07-29'),
     { racha: { len: 1, day: '2026-07-29' }, bonus: RACHA_TABLE[1], counted: true },
     'a first-ever run starts the streak at day 1');
  const d1 = settleRacha(null, '2026-07-29').racha;
  eq(settleRacha(d1, '2026-07-29'),
     { racha: { len: 1, day: '2026-07-29' }, bonus: 0, counted: false },
     'the second run of a day pays NOTHING — the day latch');
  eq(settleRacha(d1, '2026-07-30').racha, { len: 2, day: '2026-07-30' },
     'the next UTC day advances it');
  eq(settleRacha(d1, '2026-07-30').bonus, RACHA_TABLE[2], 'and pays the day-2 bonus');
  eq(settleRacha(d1, '2026-07-31').racha, { len: 1, day: '2026-07-31' },
     'a skipped day resets to 1 — a streak is consecutive or it is nothing');
  eq(settleRacha({ len: 1, day: '2026-12-31' }, '2027-01-01').racha.len, 2,
     'consecutive across a year seam still counts');
  const long = { len: 40, day: '2026-07-29' };
  eq(settleRacha(long, '2026-07-30').bonus, RACHA_TABLE[RACHA_TABLE.length - 1],
     'the bonus CAPS at the table tail — a habit, not a hostage');
  eq(settleRacha(long, '2026-07-30').racha.len, 41, 'while the length itself keeps counting');
  eq(settleRacha({ len: 3, day: '2026-07-29' }, 'garbage'),
     { racha: { len: 3, day: '2026-07-29' }, bonus: 0, counted: false },
     'a junk day key must not reset a real streak');
  eq(coerceRacha({ len: 5 }), { len: 0, day: '' }, 'a length with no day is not a streak');
  eq(coerceRacha({ len: -3, day: '2026-07-29' }), { len: 0, day: '' },
     'a negative length degrades to nothing rather than a payout');

  eq(rachaAtRisk({ len: 3, day: '2026-07-29' }, '2026-07-30', '2026-07-29'), true,
     'yesterday counted, today has not — the menu should shout');
  eq(rachaAtRisk({ len: 3, day: '2026-07-30' }, '2026-07-30', '2026-07-29'), false,
     'already counted today — nothing to protect');
  eq(rachaAtRisk({ len: 3, day: '2026-07-20' }, '2026-07-30', '2026-07-29'), false,
     'a dead streak has nothing left to shout about');
  eq(rachaShown({ len: 7, day: '2026-07-20' }, '2026-07-30', '2026-07-29'), 0,
     'a lapsed streak SHOWS as 0 — the old number would read as stolen when it reset');
  eq(rachaShown({ len: 7, day: '2026-07-29' }, '2026-07-30', '2026-07-29'), 7,
     'a streak alive on yesterday still shows its true length');
}

group('los jales — the same three for everyone, deterministically');
{
  const a = jalesForDay('2026-07-29');
  const b = jalesForDay('2026-07-29');
  eq(a, b, 'the draw is a pure function of the day');
  eq(a.length, 3, 'three jales, exactly');
  eq(new Set(a.map((m) => m.id)).size, 3, 'all three distinct');
  const poolIds = new Set(JALE_POOL.map((m) => m.id));
  eq(a.every((m) => poolIds.has(m.id)), true, 'every jale comes from the pool');
  eq(a.every((m) => JALE_POOL.find((p) => p.id === m.id).tiers.includes(m.target)), true,
     'every target is one of its jale’s authored tiers');
  // The drone jale exists and is priced as a DAY goal off the counter game.js
  // actually keeps (`drones` = passes dodged). If the stat name drifts, the
  // mission bar sticks at zero forever and looks like a mission bug.
  const droneJale = JALE_POOL.find((m) => m.id === 'drones');
  eq(!!droneJale, true, 'the pool includes the drone jale');
  eq(droneJale && droneJale.stat, 'drones', 'and it prices the dodge counter, not hits');
  eq(droneJale && droneJale.kind, 'day', 'cumulative across the day — one run need not survive three drones');

  // Different days draw differently, at least across a week — if this ever
  // fails, the hash is broken, not unlucky: 7 identical draws of 3-of-9 by
  // chance is astronomically unlikely.
  const week = ['2026-07-27', '2026-07-28', '2026-07-29', '2026-07-30',
                '2026-07-31', '2026-08-01', '2026-08-02']
    .map((d) => jalesForDay(d).map((m) => `${m.id}:${m.target}`).join(','));
  eq(new Set(week).size > 1, true, 'a week of draws is not one draw repeated');
}

group('los jales — progress, payout and the per-day latch');
{
  const day = '2026-07-29';
  const ms = jalesForDay(day);
  // A run that completes NOTHING but progresses the cumulative goals.
  const idle = { beers: 1, tacos: 0, slides: 1, jumps: 1, powerups: 0, smashes: 0,
                 drones: 0, score: 10, distance: 10, bestMult: 1 };
  const r1 = applyJalesRun(null, day, idle);
  eq(r1.payout, 0, 'nothing completed pays nothing');
  eq(r1.state.day, day, 'the record binds to the day');

  // A run that maxes every stat completes all three and the sweep.
  // Every stat the pool prices — this bundle IS the run-stats contract, and
  // adding a pool row without extending it is exactly what it failed on once.
  const monster = { beers: 999, tacos: 99, slides: 99, jumps: 99, powerups: 99,
                    smashes: 99, drones: 99, score: 99999, distance: 99999, bestMult: 8 };
  const r2 = applyJalesRun(r1.state, day, monster);
  eq(r2.completedNow.length, 3, 'a monster run completes all three');
  eq(r2.sweepNow, true, 'and takes the sweep');
  eq(r2.payout, 3 * JALE_REWARD + JALE_SWEEP, 'paying 3×15 + 25');
  const r3 = applyJalesRun(r2.state, day, monster);
  eq(r3.payout, 0, 'a second monster run pays NOTHING — done is the spent latch');
  eq(r3.completedNow, [], 'and completes nothing again');

  // Cumulative goals accumulate across runs; single-run goals do not.
  const dayGoal = ms.find((m) => m.kind === 'day');
  if (dayGoal) {
    const half = { [dayGoal.stat]: Math.ceil(dayGoal.target / 2) };
    const s1 = applyJalesRun(null, day, half);
    eq(s1.state.done[dayGoal.id] || false, false, 'half the target does not complete a cumulative jale');
    const s2 = applyJalesRun(s1.state, day, half);
    eq(s2.state.done[dayGoal.id], true, 'two halves across two runs DO — progress accumulates');
  }
  const runGoal = ms.find((m) => m.kind === 'run');
  if (runGoal) {
    const half = { [runGoal.stat]: Math.ceil(runGoal.target / 2) };
    const s1 = applyJalesRun(null, day, half);
    const s2 = applyJalesRun(s1.state, day, half);
    eq(s2.state.done[runGoal.id] || false, false,
       'two half-target runs never complete a single-run jale — it wants ONE good run');
  }

  // Yesterday's record is discarded wholesale on a new day.
  const rolled = applyJalesRun(r2.state, '2026-07-30', idle);
  eq(rolled.state.day, '2026-07-30', 'a new day starts a new record');
  eq(rolled.state.done, {}, 'with nothing done');
  eq(rolled.state.sweepPaid, false, 'and the sweep owed again');

  // jalesStatus is a read, never a write.
  const st = jalesStatus(r1.state, day);
  eq(st.list.length, 3, 'status lists the day’s three');
  eq(st.list.every((m) => m.value <= m.target), true, 'progress is capped at the target for display');
  eq(coerceJales({ day: 'nope', done: { x: true } }), { day: '', prog: {}, done: {}, sweepPaid: false },
     'a junk day voids the record rather than paying it');
  eq(coerceJales({ day: '2026-07-29', done: { a: 'yes' } }).done, {},
     'only a real true counts as done — a truthy string must not spend the latch');
}

group('merge — el fit is BOUGHT GOODS and a preference');
{
  const winner = { best: 900, gear: { 'mask-negro': true }, days: {} };
  const loser  = { best: 100, gear: { 'chain-oro': true }, days: {} };
  eq(mergeSaves(winner, loser).gear, { 'mask-negro': true, 'chain-oro': true },
     'gear UNIONS — the losing side’s mask was paid for');
  eq(mergeSaves(loser, winner).gear, { 'chain-oro': true, 'mask-negro': true },
     'in either order');
  eq(mergeSaves({ best: 1, gear: { x: 'yes', y: 0 }, days: {} },
                { best: 0, days: {} }).gear,
     {}, 'junk ownership is dropped — only a real true owns');

  const dressedNew = { best: 100, fit: { mask: 'mask-oro', chain: null }, fitSetAt: 200, days: {} };
  const dressedOld = { best: 900, fit: { mask: 'mask-negro', chain: null }, fitSetAt: 100, days: {} };
  eq(mergeSaves(dressedOld, dressedNew).fit, { mask: 'mask-oro', chain: null },
     'the NEWER outfit wins even though the other side had the better run');
  eq(mergeSaves(dressedNew, dressedOld).fitSetAt, 200, 'and carries its own timestamp');
  eq(mergeSaves(dressedOld, dressedOld).fit, { mask: 'mask-negro', chain: null },
     'a dead tie keeps local, as everywhere');
}

group('merge — la racha: the later day is the truth');
{
  const freshToday = { best: 100, racha: { len: 2, day: '2026-07-30' }, days: {} };
  const staleLong  = { best: 900, racha: { len: 9, day: '2026-07-20' }, days: {} };
  eq(mergeSaves(staleLong, freshToday).racha, { len: 2, day: '2026-07-30' },
     'a LONG stale streak loses to a short live one — maxing would resurrect a broken streak');
  eq(mergeSaves(freshToday, staleLong).racha, { len: 2, day: '2026-07-30' }, 'in either order');
  eq(mergeSaves({ best: 1, racha: { len: 3, day: '2026-07-30' }, days: {} },
                { best: 0, racha: { len: 5, day: '2026-07-30' }, days: {} }).racha,
     { len: 5, day: '2026-07-30' },
     'same day takes the longer streak — one side carries the history');
  eq(mergeSaves({ best: 1, days: {} }, { best: 0, days: {} }).racha, null,
     'no streak on either side is null, never undefined');
  eq(mergeSaves({ best: 1, racha: { len: NaN, day: '2026-07-30' }, days: {} },
                { best: 0, racha: { len: 2, day: '2026-07-29' }, days: {} }).racha,
     { len: 2, day: '2026-07-29' }, 'a corrupt streak degrades rather than winning on its day');
}

group('merge — los jales: later day wins, same day never un-pays');
{
  const today = { best: 100, days: {},
                  jales: { day: '2026-07-30', prog: { beers: 10 }, done: {}, sweepPaid: false } };
  const yesterdayDone = { best: 900, days: {},
                          jales: { day: '2026-07-29', prog: { beers: 999 },
                                   done: { chelas: true }, sweepPaid: true } };
  eq(mergeSaves(yesterdayDone, today).jales.day, '2026-07-30',
     'yesterday’s finished record loses to today’s fresh one — the daily reset is the product');

  const aSide = { best: 1, days: {},
                  jales: { day: '2026-07-30', prog: { beers: 40, tacos: 2 },
                           done: { chelas: true }, sweepPaid: false } };
  const bSide = { best: 0, days: {},
                  jales: { day: '2026-07-30', prog: { beers: 25, slides: 9 },
                           done: { tacos: true }, sweepPaid: false } };
  const m = mergeSaves(aSide, bSide);
  eq(m.jales.done, { chelas: true, tacos: true }, 'same day UNIONS done — paid stays paid on both');
  eq(m.jales.prog, { beers: 40, tacos: 2, slides: 9 }, 'and takes max progress per stat');
  eq(mergeSaves({ best: 1, days: {} }, { best: 0, days: {} }).jales, null,
     'no record on either side is null, never undefined');
}

group('formatting');
eq(formatWeekStanding(18204, 5), '18,204 · 5d', 'the total, then the turnout that explains it');

// ---------------------------------------------------------------- analytics

group('analytics — the vocabulary pin (the load-bearing one)');
{
  // THE POINT OF THIS BLOCK. Every funnel in the migration and every panel in
  // stats.html is defined against a name. A misspelled one renders as a
  // permanently-zero step, which on a dashboard is indistinguishable from a
  // real 0% — and 0% conversion is exactly the sort of number someone acts on.
  // There is no compile step in this project to catch it, so this is the catch.
  //
  // These are the names 0003_primos_analytics.sql filters on, written out as
  // literals ON PURPOSE: importing them from EVENTS would make this assert that
  // a thing equals itself. The literal side is the SQL's copy.
  const inSql = [
    'app_open', 'run_start', 'run_end',
    'tutorial_start', 'tutorial_done', 'tutorial_skip',
    'shop_open', 'shop_buy', 'shop_denied',
    'continue_offer', 'continue_take', 'continue_decline',
    'primo_open', 'primo_set',
    'sign_in_start', 'sign_in_done',
    'client_error',
  ];
  const declared = new Set(Object.values(EVENTS));
  for (const name of inSql) {
    eq(declared.has(name), true, `SQL filters on '${name}' and the client can send it`);
  }

  // The guard normalises anything that is not lower snake_case into a visible
  // 'unknown' bucket, so a name that would be normalised is a name that will
  // never match its own funnel again.
  for (const [key, name] of Object.entries(EVENTS)) {
    eq(/^[a-z][a-z0-9_]*$/.test(name) && name.length <= 40, true,
       `EVENTS.${key} survives the guard's normalisation`);
  }
}

group('analytics — a rate with no denominator is null, never zero');
{
  eq(rate(0, 0), null, '0/0 is "no data", not 0%');
  eq(rate(5, 0), null, 'and so is anything over zero');
  eq(rate(1, 4), 25, 'a real rate is a real number');
  eq(ratePct(0, 0), '—', 'the renderer prints an em dash rather than a measurement');
  eq(ratePct(1, 3), '33%', 'and rounds a real one');
  eq(retentionRate({ eligible: 0, returned: 0 }), null,
     'a cohort whose day has not elapsed reads null — folding it in drags every number down');
  eq(retentionRate({ eligible: 8, returned: 2 }), 25, 'an elapsed cohort reads honestly');
}

group('analytics — the dashboard survives a server that predates it');
{
  // A partially-applied migration, an older RPC, or a network hiccup returning
  // nonsense must degrade to EMPTY PANELS. A dashboard that throws on one
  // missing key shows nothing at all, which is the worst possible answer.
  const empty = coerceStats(null);
  eq(empty.totals.devices, 0, 'null payload coerces to zeroes');
  eq(empty.daily, [], 'and to empty lists');
  eq(empty.funnels.shop.opened, 0, 'including panels the server has never heard of');
  eq(coerceStats({ totals: 'nonsense', daily: 'nope' }).daily, [],
     'a wrong TYPE degrades the same way a missing key does');
  eq(coerceStats({ totals: { devices: '42' } }).totals.devices, 42, 'a numeric string still counts');
  eq(coerceStats({ totals: { devices: 21.5 } }).totals.devices, 22,
     'a forged float rounds rather than poisoning the panel');
  eq(coerceStats({ counts: [{ name: 'x'.repeat(80), events: 1 }] }).counts[0].name.length, 40,
     'a long name is capped on the way in, not on the way to the DOM');
}

group('analytics — funnels');
{
  const f = buildFunnel([
    { label: 'opened', value: 100 },
    { label: 'started', value: 40 },
    { label: 'finished', value: 10 },
  ]);
  eq(f[0].fromPrev, null, 'the first step has nothing to convert from');
  eq(f[1].fromPrev, 40, 'each step converts against the one before it');
  eq(f[2].fromFirst, 10, 'and reports its share of the top of the funnel');
  eq(f[2].share, 0.1, 'the bar width is that share');
  eq(buildFunnel([]), [], 'an empty funnel is empty, not a crash');
  const zero = buildFunnel([{ label: 'a', value: 0 }, { label: 'b', value: 0 }]);
  eq(zero[1].fromPrev, null, 'zero over zero stays null all the way through');
  eq(zero[1].share, 0, 'and the bar has no width rather than a NaN one');
}

group('analytics — score buckets and the day fill');
{
  // The SQL owns the bucket indices (width_bucket 0..5000 in 10 steps, which
  // yields 0 for below-range and 11 for above), this file owns the labels. The
  // count has to match or bucket 11 renders as '#11'.
  eq(SCORE_BUCKET_LABELS.length, 12, 'ten buckets plus the under- and over-range ones');
  eq(fillScoreBuckets([{ bucket: 2, runs: 7 }]).length, 12, 'the histogram is always full width');
  eq(fillScoreBuckets([{ bucket: 2, runs: 7 }])[2].runs, 7, 'a reported bucket lands in its slot');
  eq(fillScoreBuckets([{ bucket: 2, runs: 7 }])[3].runs, 0, 'and an absent one is a visible zero');
  eq(fillScoreBuckets([{ bucket: 99, runs: 7 }])[0].runs, 0, 'an out-of-range bucket is dropped, not thrown');

  // A silent day is the signal — a chart that skips it draws a smooth line
  // straight through an outage.
  const filled = fillDays([{ day: '2026-07-31', devices: 3 }], 3, '2026-07-31');
  eq(filled.length, 3, 'the window is filled to its full width');
  eq(filled.map((d) => d.day), ['2026-07-29', '2026-07-30', '2026-07-31'], 'in order, ending today');
  eq(filled[0].devices, 0, 'a day with no events is drawn as zero');
  eq(filled[2].devices, 3, 'and a real day keeps its number');
}

group('analytics — the axis');
{
  eq(niceScale(0).ticks, [0, 1], 'an all-zero chart still draws an axis');
  eq(niceScale(7).max, 8, 'a max rounds up to something readable');
  eq(niceScale(1000).max, 1000, 'a round number is left alone');
  eq(niceScale(-5).ticks, [0, 1], 'and nonsense does not produce a negative axis');
}

group('feedback — what actually leaves the device');
{
  // These four bounds are enforced AGAIN in the guard trigger
  // (20260731190000_primos_feedback.sql). The client's job is to make the
  // refusal happen before the player has typed a paragraph; the server's job is
  // to make it true. If they drift, this is the side that must be stricter — the
  // other way round promises a send the server will reject.
  eq(MIN_MESSAGE, 4, 'the floor matches the guard');
  eq(MAX_MESSAGE, 1000, 'the ceiling matches the guard');
  eq(MAX_CONTACT, 80, 'the contact cap matches the guard');
  eq(KINDS, ['bug', 'idea', 'other'], 'and the three lanes match the guard exactly');

  eq(normalizeKind('bug'), 'bug', 'a known lane survives');
  eq(normalizeKind('BUG'), 'bug', 'case does not matter');
  eq(normalizeKind('rant'), 'other', 'an unknown lane buckets rather than throwing');
  eq(normalizeKind(undefined), 'other', 'and so does nothing at all');

  eq(sanitizeMessage('  the slide sticks  '), 'the slide sticks', 'trimmed');
  eq(sanitizeMessage('a\r\nb'), 'a\nb', 'CRLF becomes a plain newline');
  eq(sanitizeMessage('a\n\n\n\n\nb'), 'a\n\nb', 'a wall of blank lines collapses to one');
  eq(sanitizeMessage('a\tb'), 'a\tb', 'tabs survive — people paste repro steps as a list');
  // The one that matters: this string's destination is a page authenticated as
  // the owner. Nothing invisible gets to ride along.
  eq(sanitizeMessage('a\u0000b\u0007c\u001bd'), 'abcd', 'control characters are stripped');
  eq(sanitizeMessage('x'.repeat(1200)).length, MAX_MESSAGE, 'and length is capped, not rejected');
  eq(sanitizeMessage(null), '', 'nothing degrades to an empty string, never to "null"');

  eq(sanitizeContact(' me@example.com '), 'me@example.com', 'contact is trimmed');
  eq(sanitizeContact('a\nb'), 'a b', 'a pasted newline cannot break the dashboard row it lands in');
  eq(sanitizeContact('x'.repeat(200)).length, MAX_CONTACT, 'and it is capped too');

  // Only the cases that short-circuit BEFORE the rate-limit ledger is read, so
  // this block cannot go red because of something you sent from this origin an
  // hour ago. The limit itself is asserted against a live server by
  // scripts/verify-rls.sh, which is the only place it is real anyway.
  eq(validateFeedback({ message: '' }).reason, 'empty', 'an empty box is refused here, not there');
  eq(validateFeedback({ message: '   ' }).reason, 'empty', 'and so is whitespace');
  eq(validateFeedback({ message: 'ok' }).reason, 'empty', 'a mis-tap is not a report');
}

group('feedback — the panel survives a server that predates it');
{
  eq(coerceFeedback(undefined).rows, [], 'no payload at all is an empty list, not a crash');
  eq(coerceFeedback({}).counts.new, 0, 'a missing count reads as zero');
  eq(coerceFeedback({ rows: 'nonsense' }).rows, [], 'a wrong TYPE degrades like a missing key');
  eq(FEEDBACK_STATUSES, ['new', 'triaged', 'done', 'spam'], 'the lanes match the RPC');

  const one = coerceFeedback({
    counts: { new: 2, total: 3 },
    rows: [{ id: '7', kind: 'bug', message: 'the slide sticks', status: 'new',
             device: 'abcd1234', device_reports: 3, created_at: '2026-07-31T12:00:00Z' }],
  }).rows[0];
  eq(one.id, 7, 'a numeric string id still counts');
  eq(one.message, 'the slide sticks', 'the message comes through whole');
  eq(one.deviceReports, 3, 'and the repeat-reporter signal survives');
  eq(coerceFeedback({ rows: [{ status: 'pwned' }] }).rows[0].status, 'new',
     'a status the client invented falls back to new rather than rendering as a lane');
  // The message is the one field allowed to be long — a report truncated to a
  // headline is a report whose repro steps are gone.
  eq(coerceFeedback({ rows: [{ message: 'x'.repeat(1500) }] }).rows[0].message.length, 1000,
     'a long message keeps its full stored length');
}

const total = document.getElementById('total');
total.className = fail === 0 ? 'pass' : 'fail';
total.textContent = fail === 0 ? `ALL ${pass} CHECKS PASS` : `${fail} FAILED · ${pass} passed`;
</script>
