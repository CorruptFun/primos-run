<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-test — pure logic for saves &amp; boards</title>
<style>
  body { margin: 0; padding: 24px; background: #1a1024; color: #fdf6e6;
         font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { font-size: 16px; letter-spacing: 0.14em; color: #ffc93c; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: rgba(253,246,230,0.5); font-size: 12px; }
  h2 { font-size: 12px; letter-spacing: 0.16em; color: rgba(253,246,230,0.62);
       margin: 20px 0 6px; text-transform: uppercase; }
  .ok { color: #9ee34f; }
  .bad { color: #ff6b6b; }
  .row { padding: 2px 0; }
  .row small { color: rgba(253,246,230,0.38); }
  #total { margin-top: 24px; padding: 12px 14px; border-radius: 10px; font-weight: 700; }
  #total.pass { background: rgba(158,227,79,0.14); border-left: 3px solid #9ee34f; }
  #total.fail { background: rgba(255,107,107,0.14); border-left: 3px solid #ff6b6b; }
</style>
</head>
<body>
<h1>CLOUD-TEST</h1>
<p class="sub">
  The pure half of the cloud layer — no network, no auth. Open this file over the dev server
  (<code>dev/cloud-test.html</code>) after touching raceday.js, merge.js or store.js.
</p>
<div id="out"></div>
<div id="total"></div>

<script type="module">
// Dynamic imports with a cache-buster: python's http.server answers with
// Last-Modified, and the browser happily reuses a stale ES module across
// reloads. On a test page that is worse than anywhere else — it shows you a
// green wall of assertions against the build you just replaced.
const V = `?t=${Date.now()}`;
const { dayKey, previousDayKey, weekOfDay, weekKey, bestForDay, recordDay, pruneDays,
        dayWasContinued, formatWeekStanding } = await import(`../js/raceday.js${V}`);
const { mergeSaves } = await import(`../js/merge.js${V}`);
const { anonName, sanitizeName } = await import(`../js/leaderboard.js${V}`);

const out = document.getElementById('out');
let pass = 0, fail = 0;

function group(title) {
  const h = document.createElement('h2');
  h.textContent = title;
  out.append(h);
}
function eq(got, want, label) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 'row ' + (ok ? 'ok' : 'bad');
  d.innerHTML = (ok ? '✓ ' : '✗ ') + label +
    (ok ? '' : ` <small>got ${JSON.stringify(got)} · want ${JSON.stringify(want)}</small>`);
  out.append(d);
}

// ─────────────────────────────────────────────────────────────────────────────
// These cases are DUPLICATED, deliberately, in the self-check at the bottom of
// supabase/migrations/0001_primos_cloud.sql. The server validates every
// submission's day key, so if the two implementations drift the database starts
// rejecting honest scores and the board silently goes empty. Change one side and
// you must change the other.
// ─────────────────────────────────────────────────────────────────────────────
group('day keys — must match primos_day_key()');
eq(dayKey(new Date('2026-07-29T00:00:00Z')), '2026-07-29', 'the moment the board opens');
eq(dayKey(new Date('2026-07-29T23:59:59Z')), '2026-07-29', 'last second of the same board');
eq(dayKey(new Date('2026-07-30T00:00:00Z')), '2026-07-30', 'the rollover, exactly');
eq(dayKey(new Date('2026-01-01T12:00:00Z')), '2026-01-01', 'year seam');
eq(dayKey(new Date('2026-03-01T00:00:00Z')), '2026-03-01', 'month seam, non-leap February');
eq(previousDayKey(new Date('2026-01-01T00:30:00Z')), '2025-12-31', 'yesterday across a year seam');

group('ISO weeks — must match primos_week_of_day()');
eq(weekOfDay('2026-07-27'), '2026-W31', 'Monday: the season opens');
eq(weekOfDay('2026-08-02'), '2026-W31', 'Sunday: still the same season');
eq(weekOfDay('2026-08-03'), '2026-W32', 'next Monday: a new one');
eq(weekOfDay('2025-12-29'), '2026-W01', 'ISO year seam: W01 starts in December');
eq(weekOfDay('2026-01-04'), '2026-W01', 'W01 tail');
eq(weekOfDay('2026-01-05'), '2026-W02', 'W02 head');
eq(weekKey(new Date('2026-08-02T23:00:00Z')), '2026-W31', 'weekKey composes dayKey');

group('anonymous name — must match primos_anon_display_name()');
eq(anonName('7f3a91b2-0000-4000-8000-000000000000'), 'Player 7F3A', 'the shared case the migration asserts');
eq(anonName(null), 'player', 'no user id degrades, never throws');

group('name sanitising — the privacy invariant');
eq(sanitizeName('jane.doe@gmail.com'), 'jane.doe', 'an email is cut at the @, never published whole');
eq(sanitizeName('  <script>  '), 'script', 'markup characters are stripped');
eq(sanitizeName(''), 'player', 'empty falls back');
eq(sanitizeName('Ñoño Güero'), 'Ñoño Güero', 'accented letters survive — ASCII-only would mangle names');
eq(sanitizeName('x'.repeat(40)).length, 24, 'capped at 24');

group('day records');
{
  const s = { days: {} };
  recordDay(s, 500, new Date('2026-07-29T10:00:00Z'));
  recordDay(s, 300, new Date('2026-07-29T11:00:00Z'));
  eq(bestForDay(s, '2026-07-29'), 500, 'keeps the day BEST, not the last run');
  recordDay(s, 900, new Date('2026-07-29T12:00:00Z'));
  eq(bestForDay(s, '2026-07-29'), 900, 'a better run raises it');
  eq(bestForDay({ days: { x: NaN } }, 'x'), 0, 'a corrupt entry degrades to 0, never NaN');
  eq(bestForDay({}, '2026-07-29'), 0, 'a save with no days map is fine');

  s.days['2026-01-01'] = 1;
  pruneDays(s, 60, new Date('2026-07-29T00:00:00Z'));
  eq(Object.keys(s.days).sort(), ['2026-07-29'], 'days beyond the window are dropped');
}

group('merge — the one function that can destroy progress');
{
  const local = { best: 900, bestBeers: 3, runs: 10, totalBeers: 40, character: 'chuy',
                  days: { '2026-07-29': 900 }, handle: 'local', handleSetAt: 100 };
  const cloud = { best: 500, bestBeers: 9, runs: 4, totalBeers: 80, character: 'flaca',
                  days: { '2026-07-28': 500 }, handle: 'cloud', handleSetAt: 200 };
  const m = mergeSaves(local, cloud);

  eq(m.best, 900, 'best is maxed');
  eq(m.bestBeers, 9, 'a record only the LOSING side holds still survives');
  eq(m.totalBeers, 80, 'lifetime counters are maxed, not taken from the winner');
  eq(m.runs, 10, 'runs maxed');
  eq(m.character, 'chuy', 'preferences come from the progress winner');
  eq(m.days, { '2026-07-29': 900, '2026-07-28': 500 },
     'both devices’ boards survive — picking a side would delete one');
  eq(m.handle, 'cloud', 'the newer NAME wins even though the other side had the better run');
  eq(mergeSaves(local, local).handle, 'local', 'a dead tie prefers local');
  eq(mergeSaves(local, cloud).best, mergeSaves(cloud, local).best, 'best is order-independent');

  const cleared = { best: 0, bestBeers: 0, runs: 0, totalBeers: 0, days: {}, handle: null, handleSetAt: 0 };
  eq(mergeSaves(cleared, cloud).handle, 'cloud', 'a cleared browser adopts the cloud’s name');
  eq(mergeSaves(cleared, cloud).best, 500, 'and its progress');
}

group('merge — money, where a mistake MINTS currency');
{
  // The shape a max would reward: the spend already happened on the side that
  // also holds the better run, and the other device has not heard about it.
  const rich  = { best: 100, walletSeeded: true, chelas: 500, days: {} };
  const spent = { best: 900, walletSeeded: true, chelas: 0,   days: {} };
  eq(mergeSaves(spent, rich).chelas, 0, 'chelas is NOT maxed — a max hands back what was already spent');
  eq(mergeSaves(rich, spent).chelas, 0, 'and that does not depend on argument order');

  // Both seeded → the balance rides the progress winner, like the rest of the
  // record. Always a number some device genuinely held; nothing is invented.
  const a300 = { best: 900, walletSeeded: true, chelas: 300, days: {} };
  const b50  = { best: 100, walletSeeded: true, chelas: 50,  days: {} };
  eq(mergeSaves(b50, a300).chelas, 300, 'two seeded wallets ride the progress winner');

  // The one-time latch. Without the union the seed re-runs against a totalBeers
  // that LATCHES has just maxed, and mints the whole lifetime total again.
  const seeded   = { best: 100, walletSeeded: true,  chelas: 200, days: {} };
  const unseeded = { best: 900, walletSeeded: false, totalBeers: 5000, days: {} };
  const mixed = mergeSaves(unseeded, seeded);
  eq(mixed.walletSeeded, true, 'walletSeeded UNIONS — true wins, so the seed can never run twice');
  eq(mixed.chelas, 200, 'and the seeded side’s balance carries, even though it LOST on progress');
  eq(mergeSaves(seeded, unseeded).walletSeeded, true, 'the union is order-independent');

  // Neither side has seeded yet: the latch stays down and the seed is still to
  // come, which is the truth — it has not happened on either device.
  const fresh1 = { best: 900, totalBeers: 400, days: {} };
  const fresh2 = { best: 100, totalBeers: 900, days: {} };
  const neither = mergeSaves(fresh1, fresh2);
  eq(neither.walletSeeded, false, 'neither seeded leaves the latch down');
  eq(neither.totalBeers, 900, 'lifetime total is still maxed — that one is a record');
  eq(neither.chelas, 0, 'and the wallet is zero until the one-time seed runs');

  eq(mergeSaves({ best: 1, walletSeeded: true, chelas: NaN, days: {} },
                { best: 0, walletSeeded: true, chelas: 5, days: {} }).chelas,
     0, 'a corrupt balance degrades to 0 — never NaN into a save');
}

group('merge — the shelf is BOUGHT GOODS');
{
  const winner = { best: 900, shelf: { vida: 1 }, days: {} };
  const loser  = { best: 100, shelf: { magnet: 2 }, days: {} };
  const m = mergeSaves(winner, loser);
  eq(m.shelf, { vida: 1, magnet: 2 },
     'the LOSING side’s purchase survives — riding the winner would bin something paid for');
  const flipped = mergeSaves(loser, winner);
  eq(Object.keys(flipped.shelf).sort(), ['magnet', 'vida'], 'union is order-independent');
  eq(flipped.shelf.magnet, 2, 'and so are the counts');

  eq(mergeSaves({ best: 900, shelf: { vida: 1 }, days: {} },
                { best: 100, shelf: { vida: 3 }, days: {} }).shelf,
     { vida: 3 }, 'per item it takes the MAX, so a stack is not silently cut down');

  eq(mergeSaves({ best: 1, shelf: { vida: NaN, gone: 0, bad: -2 }, days: {} },
                { best: 0, days: {} }).shelf,
     {}, 'junk counts are dropped rather than written back into the save');
  eq(mergeSaves({ best: 1, days: {} }, { best: 0, days: {} }).shelf, {},
     'no shelf on either side is an empty shelf, not undefined');
}

group('continues — eligible, but marked');
{
  const at = new Date('2026-07-29T10:00:00Z');
  const s = { days: {}, contDays: {} };

  recordDay(s, 400, at, true);
  eq(dayWasContinued(s, '2026-07-29'), true, 'a bought run marks the day it takes');

  recordDay(s, 200, at, false);
  eq(bestForDay(s, '2026-07-29'), 400, 'a weaker clean run does not take the day');
  eq(dayWasContinued(s, '2026-07-29'), true,
     'and cannot scrub the mark off the score that still stands');

  recordDay(s, 900, at, false);
  eq(bestForDay(s, '2026-07-29'), 900, 'a better clean run does take it');
  eq(dayWasContinued(s, '2026-07-29'), false, 'and the mark goes with the old score');

  eq(dayWasContinued({}, '2026-07-29'), false, 'a save with no map is unmarked, never undefined');

  // Pruning has to take both maps or the marks outlive their scores.
  const old = { days: { '2026-01-01': 5, '2026-07-29': 9 },
                contDays: { '2026-01-01': true, '2026-07-29': true } };
  pruneDays(old, 60, new Date('2026-07-29T00:00:00Z'));
  eq(Object.keys(old.contDays), ['2026-07-29'], 'marks are pruned with the days they annotate');
}

group('continues — the mark survives a merge intact');
{
  const boughtHigh = { best: 1, days: { d: 900 }, contDays: { d: true } };
  const cleanLow   = { best: 1, days: { d: 400 }, contDays: {} };
  eq(mergeSaves(cleanLow, boughtHigh).days.d, 900, 'the better day wins, as always');
  eq(mergeSaves(cleanLow, boughtHigh).contDays, { d: true },
     'and its mark comes with it — the surviving score really was bought');

  const cleanHigh  = { best: 1, days: { d: 900 }, contDays: {} };
  const boughtLow  = { best: 1, days: { d: 400 }, contDays: { d: true } };
  eq(mergeSaves(cleanHigh, boughtLow).contDays, {},
     'a losing bought day does NOT mark a clean winner — a union would smear it');
  eq(mergeSaves(boughtLow, cleanHigh).contDays, {}, 'and that holds in either order');

  eq(mergeSaves({ best: 1, days: { a: 1 }, contDays: { a: true } },
                { best: 1, days: { b: 2 }, contDays: {} }).contDays,
     { a: true }, 'days only one device played keep their own marks');
}

group('formatting');
eq(formatWeekStanding(18204, 5), '18,204 · 5d', 'the total, then the turnout that explains it');

const total = document.getElementById('total');
total.className = fail === 0 ? 'pass' : 'fail';
total.textContent = fail === 0 ? `ALL ${pass} CHECKS PASS` : `${fail} FAILED · ${pass} passed`;
</script>
</body>
</html>
